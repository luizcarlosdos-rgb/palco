*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e0f11;color:#e8eaed;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100%,768px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px #262a30}#stage::-webkit-scrollbar{display:none}body.limpo #top,body.limpo #bot,body.limpo #abot,body.limpo .edge{display:none!important}.fl{position:absolute;bottom:18px;z-index:30;width:58px;height:58px;border-radius:50%;border:1px solid #6b7f99;background:rgba(27,39,53,.55);color:#e8eef8;opacity:.4;display:none;align-items:center;justify-content:center;padding:0}.fl.on{display:flex}.fl:active{opacity:.9}#fl-p{left:14px}#fl-n{right:14px}










@media (orientation:landscape){#app{--w:min(768px,calc(100vh*0.7));width:var(--w);height:calc(var(--w)*4/3);bottom:auto;top:max(0px,calc((100vh - var(--w)*4/3)/2))}}
@media (hover:hover) and (pointer:fine){#app{--w:min(800px,100vw,calc(100vh*0.625));width:var(--w);height:calc(var(--w)*8/5);bottom:auto;top:calc((100vh - var(--w)*8/5)/2)}}
#top{height:46px;flex:none;display:flex;align-items:center;padding:0 14px;gap:10px;background:#16181c;border-bottom:1px solid #262a30}
#ttl{flex:1;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ttl small{font-weight:400;color:#8a8f98;margin-left:8px}
.ib{width:52px;height:44px;border-radius:10px;border:1px solid #3a3f47;background:#1d2024;color:#e8eaed;display:flex;align-items:center;justify-content:center;font-size:22px}
.ib:active{background:#2a2e34}
.ib[disabled]{opacity:.3}
#stage{flex:1;min-height:0;min-width:0;overflow:auto;scrollbar-width:none;display:flex;container-type:size;background:#283747;-webkit-overflow-scrolling:touch}body.claro #stage{background:#d9dde6}
#wrap{margin:auto;flex:none;width:calc(min(100cqw,100cqh*var(--asp,.7071))*var(--z,1))}
#wrap svg{display:block;width:100%;height:auto;background:#283747;color:#b4cdf6}#wrap canvas{display:block;width:100%;height:auto;background:#fff}body.claro #wrap svg{background:#fff;color:#111}
body.solo #bot{display:none}body.banda #abot,body.banda .edge,body.banda #tomTop{display:none}
body.pdf #tom,body.pdf #tomTop{display:none!important}
#abot{flex:none;background:#16181c;border-top:1px solid #262a30;padding:8px 14px 12px;position:relative}
#arow1{display:flex;align-items:center;gap:10px}
#mchip{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid #6b717b;background:#1d2024;color:#e8eaed;font-size:16px;text-align:left;padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mchip.empty{color:#8a8f98}
.sk{width:48px;height:40px;border-radius:12px;border:1px solid #6b717b;background:#1d2024;color:#e8eaed;display:flex;align-items:center;justify-content:center;opacity:.45}
.sk svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#arow2{display:flex;align-items:center;gap:10px;padding:6px 4px 2px;color:#8a8f98;font-size:13px}
#seek{flex:1;accent-color:#3ddc84;height:22px}
#arow{display:flex;align-items:center;justify-content:center;gap:18px;padding-top:6px}
#arow button{border-radius:16px;border:2px solid #8a909a;background:#1d2024;color:#e8eaed;display:flex;align-items:center;justify-content:center;width:68px;height:52px}
#arow button:active{background:#2a2e34}
#arow #pp{width:88px;height:60px}#arow #pp.on{background:#1f6f43;border-color:#3ddc84}
#arow svg{width:28px;height:28px;fill:currentColor}
#mlist{position:absolute;left:14px;right:14px;bottom:100%;margin-bottom:6px;background:#1d2024;border:1px solid #4a4f58;border-radius:14px;padding:6px;display:none;max-height:260px;overflow:auto;z-index:10}
#mlist button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#e8eaed;font-size:16px;text-align:left;padding:14px 12px;border-radius:10px}
#mlist button:active{background:#2a2e34}#mlist button.cur{color:#3ddc84}
.edge{position:absolute;top:calc(50% - 34px);width:42px;height:68px;border-radius:14px;background:rgba(29,32,36,.8);border:1px solid #4a4f58;color:#e8eaed;font-size:34px;z-index:5;display:none;align-items:center;justify-content:center}
.edge[disabled]{opacity:.25}#pl{left:6px}#pr{right:6px}
body.solo .edge{display:flex}
#tomTop{width:auto!important;padding:0 14px;font-size:18px!important;font-weight:700;gap:6px}

#bot{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#16181c;border-top:1px solid #262a30}
#bot .ib{width:84px;height:50px;font-size:28px}
#tom{width:130px!important;font-size:20px!important;font-weight:700;gap:8px}

  const w=svg.getBoundingClientRect().width; if(!w) return; const k=827/w;
  const R=e=>{const r=e.getBoundingClientRect();return {l:r.left*k,r:r.right*k,t:r.top*k,b:r.bottom*k}};
  const hit=(a,b)=>a.l<b.r-1&&a.r>b.l+1&&a.t<b.b-1&&a.b>b.t+1;
  const sh=(a,dx,dy)=>({l:a.l+dx,r:a.r+dx,t:a.t+dy,b:a.b+dy});
  const fixed=[...svg.querySelectorAll('text.ch,text.nc')].map(R);
  const placed=[];
  const place=(e,cands)=>{
    const box=R(e); const others=fixed.concat(placed);
    let best=null,bs=1e9;
    for(const [dx,dy] of cands){ const b=sh(box,dx,dy); let c=0; for(const o of others) if(hit(b,o)) c++; const cost=c*1000+Math.abs(dx)+Math.abs(dy)*1.5; if(cost<bs){bs=cost;best=[dx,dy,b];} if(c===0) break; }
    if(best[0]||best[1]) e.setAttribute('transform',`translate(${best[0]} ${best[1]}) `+(e.getAttribute('transform')||''));
    placed.push(best[2]);
  };
  const cr=[]; for(const dy of [0,-4,-8,-12,4]) for(const dx of [0,8,-8,16,-16,24,-24,34,-34,46,-46,60,-60,76,-76]) cr.push([dx,dy]);

  svg.querySelectorAll('g.rg').forEach(g=>place(g,cr));
  const ct=[]; for(const dy of [0,4,8,12,16,-4,-8]) ct.push([0,dy]);
  svg.querySelectorAll('text.bt').forEach(e=>place(e,ct));
}

/* guardar no aparelho (IndexedDB): letras, MP3 ligados e shows de cada modo */
(function(){
  let db=null, ready=false, busy=false, again=false, lastShows='', lastMode=null, lastAuto=null, lastPend='{}';
  const open=()=>new Promise((res,rej)=>{ try{ const r=indexedDB.open('palco',1); r.onupgradeneeded=()=>{ ['lib','meta','audio','kv'].forEach(s=>r.result.createObjectStore(s)); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } });
  const get=(s,k)=>new Promise((res,rej)=>{ const r=db.transaction(s,'readonly').objectStore(s).get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const all=s=>new Promise((res,rej)=>{ const o={}; const r=db.transaction(s,'readonly').objectStore(s).openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ o[c.key]=c.value; c.continue(); } else res(o); }; r.onerror=()=>rej(r.error); });
  const put=(s,k,v)=>new Promise((res,rej)=>{ const t=db.transaction(s,'readwrite'); t.objectStore(s).put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
  async function save(){ if(!db||!ready) return; if(busy){ again=true; return; } busy=true;
    try{
      for(const x of AUD.slice()){ if(!x._saved){ const bl=x.blob||await (await fetch(x.url)).blob(); await put('audio',x._id,{name:x.name,blob:bl}); x._saved=true; } }
      for(const en of LIB.slice()){ const key=en.n.toLowerCase();
        if(!en._saved){ const rec={n:en.n,k:en.k,p:en.p}; if(en.k==='pdf') rec.bytes=await en.o.getData(); else rec.o=en.o; await put('lib',key,rec); en._saved=true; }
        let aid=null; if(en.au){ if(!en.au._id){ const id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); const b=await (await fetch(en.au.url)).blob(); await put('audio',id,{name:en.au.name,blob:b}); en.au._id=id; } aid=en.au._id; }
        const sig=JSON.stringify([en.pg||0,aid]); if(en._sig!==sig){ await put('meta',key,{pg:en.pg||0,aid}); en._sig=sig; }
      }
      if(mode!==lastMode){ await put('kv','modo',mode); lastMode=mode; } if(AUTO!==lastAuto){ await put('kv','auto',AUTO); lastAuto=AUTO; }
      const pj=JSON.stringify(PEND); if(pj!==lastPend){ await put('kv','pend',PEND); lastPend=pj; }
      const sh={banda:ST.banda.shows,solo:ST.solo.shows}; sh[mode]=SHOWS.slice(); const js=JSON.stringify(sh); if(js!==lastShows){ await put('kv','shows',sh); lastShows=js; }
    }catch(e){}
    busy=false; if(again){ again=false; save(); }
  }
  async function load(){
    try{ db=await open(); pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
      const lib=await all('lib'), meta=await all('meta'), aud=await all('audio'), kv=await get('kv','shows'), cache={};
      for(const key of Object.keys(lib)){ const r=lib[key]; let o=r.o; if(r.k==='pdf'){ try{ o=await pdfjsLib.getDocument({data:new Uint8Array(r.bytes)}).promise; }catch(e){ continue; } }
        const en={n:r.n,k:r.k,o,p:r.p,_saved:true}; const m=meta[key]||{}; if(m.pg) en.pg=m.pg;
        if(m.aid&&aud[m.aid]){ if(!cache[m.aid]){ cache[m.aid]={name:aud[m.aid].name,url:URL.createObjectURL(aud[m.aid].blob),_id:m.aid}; media.push(cache[m.aid]); } en.au=cache[m.aid]; }
        en._sig=JSON.stringify([en.pg||0,en.au?en.au._id:null]);
        const i=libIdx(en.n); if(i>=0) LIB[i]=en; else LIB.push(en); }
      for(const id of Object.keys(aud)){ if(!cache[id]){ cache[id]={name:aud[id].name,url:URL.createObjectURL(aud[id].blob),_id:id}; media.push(cache[id]); } cache[id]._saved=true; AUD.push(cache[id]); }
      const pe=await get('kv','pend'); if(pe){ for(const k in pe) PEND[k]=pe[k]; } lastPend=JSON.stringify(PEND);
      const mo=await get('kv','modo'), au0=await get('kv','auto'); if(mo==='solo'&&mode!=='solo') setMode('solo'); AUTO=au0===true?1:(+au0||0); lastAuto=AUTO; lastMode=mode; try{ $('m-auto').textContent=autoTxt(); }catch(e){}
      if(kv){ ST.banda.shows=kv.banda||[]; ST.solo.shows=kv.solo||[]; SHOWS.splice(0); SHOWS.push(...ST[mode].shows); lastShows=JSON.stringify(kv); }
    }catch(e){ db=null; }
    ready=true; try{ drawMedia(); }catch(e){} drawHome();
  }
  window.palcoSave=save;
  setInterval(()=>{ try{ save(); }catch(e){} },1500);
  document.addEventListener('visibilitychange',()=>{ try{ save(); }catch(e){} });
  window.addEventListener('pagehide',()=>{ try{ save(); }catch(e){} });
  window.palcoDelLib=n=>{ if(!db) return; const k=String(n).toLowerCase(); try{ const t=db.transaction(['lib','meta'],'readwrite'); t.objectStore('lib').delete(k); t.objectStore('meta').delete(k); }catch(e){} };
  window.palcoDelAudio=id=>{ if(!db) return; try{ db.transaction('audio','readwrite').objectStore('audio').delete(id); }catch(e){} };
  load().then(()=>{ setInterval(save,2500); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
})();

  const ub64=s=>{ const bin=atob(s), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
  $('m-bkp').onclick=async()=>{ try{ const lib=[];
    for(const en of LIB){ const r={n:en.n,k:en.k,p:en.p,pg:en.pg||0,aid:en.au?en.au._id:null}; if(en.k==='pdf') r.b=b64(await en.o.getData()); else r.o=en.o; lib.push(r); }
    const names=Object.assign({},PEND); AUD.forEach(x=>{ names[x._id]=x.name; });
    const sh={banda:ST.banda.shows,solo:ST.solo.shows}; sh[mode]=SHOWS.slice();
    const d={app:'palco',v:1,data:new Date().toISOString(),modo:mode,lib,shows:sh,audios:names};
    const fn='backup-palco-'+new Date().toISOString().slice(0,10)+'.json'; const file=new File([JSON.stringify(d)],fn,{type:'application/json'});
    let dl=null; try{ dl=await window.claude.use('downloads'); }catch(e){}
    if(dl){ try{ await dl.save({filename:fn,data:JSON.stringify(d)}); toast('Backup salvo: '+fn); }catch(e){ toast('Backup não salvo.'); } return; }
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:'Backup do app de palco'}); toast('Backup pronto'); }catch(e){ if(e&&e.name!=='AbortError') toast('Não consegui salvar o backup.'); } return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); toast('Backup salvo: '+fn); }catch(e){ toast('Não consegui salvar o backup.'); } };
  const fi=document.createElement('input'); fi.type='file'; fi.accept='*/*'; fi.hidden=true; document.body.appendChild(fi);
  let rstOn=false; $('m-rst').onclick=()=>{ rstOn=true; $('file').accept='.json,application/json'; $('file').multiple=false; $('file').click(); };
  $('file').addEventListener('change',e=>{ if(!rstOn) return; rstOn=false; e.stopImmediatePropagation(); const f=e.target.files[0]; e.target.value=''; if(f) run(f); },true);
  const run=async f=>{ let d;
    try{ d=JSON.parse(await f.text()); if(d.app!=='palco'||!Array.isArray(d.lib)) throw 0; }catch(e){ toast('Esse arquivo não é um backup do app.'); return; }
    const ns=Object.keys(d.shows||{}).reduce((t,m)=>t+((d.shows[m]||[]).length),0);
    const ok=await ask({title:'Restaurar backup?',msg:d.lib.length+' letras e '+ns+' shows. Nada do que já está no app é apagado; letras com o mesmo nome são atualizadas.',ok:'Restaurar'}); if(!ok) return;
    try{ pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js'; const nm=d.audios||{}, idByEntry={}; let nl=0, np=0;
      for(const r of d.lib){ idByEntry[r.n.toLowerCase()]=r.aid||null; try{ if(r.k==='pdf'){ const doc=await pdfjsLib.getDocument({data:ub64(r.b)}).promise; const en={n:r.n,k:'pdf',o:doc,p:doc.numPages}; if(r.pg) en.pg=r.pg; addLib(en); } else if(r.k==='lset'){ addLib({n:r.n,k:'lset',o:r.o,p:r.p}); } else addLib({n:r.n,k:'blank',o:null,p:r.p||1}); nl++; }catch(e){} }
      const fixAu=it=>{ if(it.t!=='s') return; let a=it.a; if(!a){ a=idByEntry[String(it.n).toLowerCase()]; } if(!a||a==='-') return; const name=nm[a]; const ex=name?AUD.find(x=>x.name===name):null; if(ex){ it.a=ex._id; return; } if(name){ PEND[a]=name; np++; } it.a=a; };
      const have=new Set([...SHOWS,...ST.banda.shows,...ST.solo.shows].map(s=>s.id)); let nsh=0;
      for(const m of ['banda','solo']){ for(const s of (d.shows[m]||[])){ if(have.has(s.id)) continue; if(m==='solo') s.items.forEach(fixAu); (m===mode?SHOWS:ST[m].shows).push(s); have.add(s.id); nsh++; } }
      try{ window.palcoSave&&window.palcoSave(); }catch(e){} drawHome(); toast('Backup restaurado: '+nl+' letras, '+nsh+' shows'+(np?'. Adicione os MP3 de novo, eles se ligam pelo nome.':''));
    }catch(e){ toast('Não consegui restaurar o backup.'); } };
})();
try{ document.fonts.load("50px PalcoJazz").then(()=>render()); }catch(e){}
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
</script>
